services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estudio
      POSTGRES_USER: estudio
      POSTGRES_PASSWORD: estudio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/estudio
      DB_USER: estudio
      DB_PASSWORD: estudio
      # Os valores abaixo vêm do arquivo .env (copie de .env.example)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TEMPLATE_INATIVIDADE: ${WHATSAPP_TEMPLATE_INATIVIDADE:-aluna_inativa}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}

volumes:
  pgdata:
